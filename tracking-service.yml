server:
  port: 8083

spring:
  application:
    name: TRACKING-SERVICE
  datasource:
    url: jdbc:mysql://mysql-db:3306/tracking_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

file:
  upload-dir: /app/tracking-uploads/ 

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/ 
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin-server:9411/api/v2/spans # ✅ Docker Zipkin
