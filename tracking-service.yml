server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/tracking_db
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB


file:
  upload-dir: /app/tracking-uploads/

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/ 

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin-server:9411/api/v2/spans
