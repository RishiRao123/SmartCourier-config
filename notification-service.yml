server:
  port: 8085

spring:
  application:
    name: NOTIFICATION-SERVICE
  rabbitmq:
    host: rabbitmq
    port: 5672
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:your-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

notification:
  from-email: ${GMAIL_USERNAME:your-email@gmail.com}
  from-name: SmartCourier
  frontend-base-url: http://localhost:5173

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin-server:9411/api/v2/spans
